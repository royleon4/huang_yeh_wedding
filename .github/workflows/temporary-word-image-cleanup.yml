name: Temporary Word and image cleanup

on:
  push:
    branches:
      - cleanup/word-only-import-image-only-attachments
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/word-only-import-image-only-attachments

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply cleanup
        run: node artifacts/memories-album/scripts/apply-word-only-image-only-cleanup.mjs

      - name: Synchronize lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Run focused tests
        run: pnpm --filter @workspace/memories-album run test

      - name: Build Memories
        run: pnpm --filter @workspace/memories-album run build

      - name: Remove temporary automation
        run: |
          rm -f artifacts/memories-album/scripts/apply-word-only-image-only-cleanup.mjs
          rm -f .github/workflows/temporary-word-image-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restrict editor to Word imports and image uploads"
          git push origin HEAD:cleanup/word-only-import-image-only-attachments
