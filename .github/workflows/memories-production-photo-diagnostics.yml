name: Memories production photo diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/memories-production-photo-diagnostics.yml"
      - "artifacts/memories-album/scripts/diagnose-production-photos.mjs"
      - "artifacts/memories-album/scripts/diagnose-production-photo-paths.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/official-thumbnail-root-cause'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose production photo metadata and thumbnails
        env:
          MEMORIES_PRODUCTION_URL: https://leon-loves-yeh.com
        run: node artifacts/memories-album/scripts/diagnose-production-photos.mjs
      - name: Diagnose production thumbnail and media paths
        env:
          MEMORIES_PRODUCTION_URL: https://leon-loves-yeh.com
        run: node artifacts/memories-album/scripts/diagnose-production-photo-paths.mjs
      - name: Upload production photo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-photo-diagnostics
          path: |
            production-photo-diagnostics.json
            production-photo-path-diagnostics.json
          if-no-files-found: warn
          retention-days: 7
