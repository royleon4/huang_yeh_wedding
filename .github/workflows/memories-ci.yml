name: Standalone Memories CI

on:
  pull_request:
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-ci.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-ci.yml"

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Commit generated lockfile on the Word import branch
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/admin-word-import'
        shell: bash
        run: |
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Synchronize Mammoth dependency lockfile"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Test standalone Memories
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/memories-album run test 2>&1 | tee memories-test-output.txt

      - name: Validate responsive navigation in Chrome
        run: pnpm --filter @workspace/memories-album run test:layout-browser

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memories-test-output
          path: memories-test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Build standalone Memories
        run: pnpm --filter @workspace/memories-album run build

      - name: Smoke-test production server
        run: |
          PORT=19316 pnpm --filter @workspace/memories-album run start &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19316/Memories/api/health >/tmp/memories-health.json; then
              cat /tmp/memories-health.json
              exit 0
            fi
            sleep 1
          done
          echo "Memories production server did not become healthy" >&2
          exit 1
