name: Standalone Memories Full CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-fast-ci.yml"
      - ".github/workflows/memories-ci.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-fast-ci.yml"
      - ".github/workflows/memories-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memories-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test standalone Memories
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/memories-album run test 2>&1 | tee memories-test-output.txt

      - name: Validate focused browser layouts in Chrome
        run: pnpm --filter @workspace/memories-album run test:layout-browser

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memories-test-output
          path: memories-test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Build standalone Memories
        run: pnpm --filter @workspace/memories-album run build

      - name: Smoke-test production server
        run: |
          PORT=19316 pnpm --filter @workspace/memories-album run start &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19316/Memories/api/health >/tmp/memories-health.json; then
              cat /tmp/memories-health.json
              exit 0
            fi
            sleep 1
          done
          echo "Memories production server did not become healthy" >&2
          exit 1
