name: Standalone Memories CI

on:
  pull_request:
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-ci.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-ci.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test standalone Memories
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/memories-album run test 2>&1 | tee memories-test-output.txt

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memories-test-output
          path: memories-test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Build standalone Memories
        run: pnpm --filter @workspace/memories-album run build

      - name: Smoke-test production server
        run: |
          PORT=19316 pnpm --filter @workspace/memories-album run start &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          healthy=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19316/Memories/api/health >/tmp/memories-health.json; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [ "$healthy" -ne 1 ]; then
            echo "Memories production server did not become healthy" >&2
            exit 1
          fi
          cat /tmp/memories-health.json

          public_status=$(curl --silent --output /tmp/memories-public.html --write-out '%{http_code}' \
            http://127.0.0.1:19316/Memories/)
          test "$public_status" = "200"
          grep -q '<div id="root"' /tmp/memories-public.html

          admin_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:19316/Memories/admin)
          test "$admin_status" = "303"

          login_status=$(curl --silent --output /tmp/memories-admin-login.html --write-out '%{http_code}' \
            http://127.0.0.1:19316/Memories/admin/login)
          test "$login_status" = "200"
          grep -q '<div id="root"' /tmp/memories-admin-login.html
