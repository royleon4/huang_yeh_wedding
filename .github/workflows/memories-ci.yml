name: Standalone Memories Full CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-fast-ci.yml"
      - ".github/workflows/memories-ci.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-fast-ci.yml"
      - ".github/workflows/memories-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memories-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select impacted validation
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "tests=[]" >> "$GITHUB_OUTPUT"
            echo "browser=all" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "changed_count=0" >> "$GITHUB_OUTPUT"
            echo "reason=main or manually dispatched integration gate" >> "$GITHUB_OUTPUT"
          else
            node artifacts/memories-album/scripts/select-tests.mjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Report selected scope
        run: |
          echo "Mode: ${{ steps.impact.outputs.mode }}"
          echo "Browser: ${{ steps.impact.outputs.browser }}"
          echo "Build: ${{ steps.impact.outputs.build }}"
          echo "Changed files: ${{ steps.impact.outputs.changed_count }}"
          echo "Reason: ${{ steps.impact.outputs.reason }}"
          echo 'Tests: ${{ steps.impact.outputs.tests }}'

      - name: Set up pnpm
        if: steps.impact.outputs.mode != 'none'
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        if: steps.impact.outputs.mode != 'none'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        if: steps.impact.outputs.mode != 'none'
        run: pnpm install --no-frozen-lockfile

      - name: Run targeted Memories tests
        if: steps.impact.outputs.mode == 'targeted'
        env:
          SELECTED_TESTS: ${{ steps.impact.outputs.tests }}
        shell: bash
        run: |
          set -o pipefail
          node --input-type=module -e '
            import { spawnSync } from "node:child_process";
            const tests = JSON.parse(process.env.SELECTED_TESTS || "[]");
            if (tests.length === 0) {
              throw new Error("Targeted mode selected without test files");
            }
            const result = spawnSync(process.execPath, ["--test", ...tests], {
              stdio: "inherit",
            });
            process.exit(result.status ?? 1);
          ' 2>&1 | tee memories-test-output.txt

      - name: Run full Memories unit and API tests
        if: steps.impact.outputs.mode == 'full'
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/memories-album run test 2>&1 | tee memories-test-output.txt

      - name: Validate guestbook layout in Chrome
        if: steps.impact.outputs.browser == 'guestbook'
        run: pnpm --filter @workspace/memories-album run test:layout-guestbook

      - name: Validate navigation layout in Chrome
        if: steps.impact.outputs.browser == 'navigation'
        run: pnpm --filter @workspace/memories-album run test:layout-navigation

      - name: Validate all focused browser layouts
        if: steps.impact.outputs.browser == 'all'
        run: pnpm --filter @workspace/memories-album run test:layout-browser

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memories-test-output
          path: memories-test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Build impacted production surface
        if: steps.impact.outputs.build == 'true'
        run: pnpm --filter @workspace/memories-album run build

      - name: Smoke-test built production server
        if: steps.impact.outputs.build == 'true'
        run: |
          PORT=19316 pnpm --filter @workspace/memories-album run start &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19316/Memories/api/health >/tmp/memories-health.json; then
              cat /tmp/memories-health.json
              exit 0
            fi
            sleep 1
          done
          echo "Memories production server did not become healthy" >&2
          exit 1

      - name: Skip executable checks for documentation-only changes
        if: steps.impact.outputs.mode == 'none'
        run: echo "No executable Memories files changed."
