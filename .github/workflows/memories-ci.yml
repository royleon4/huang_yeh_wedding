name: Standalone Memories CI

on:
  pull_request:
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-ci.yml"
      - "scripts/repo-audit-cleanup.mjs"
  push:
    branches: [main]
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-ci.yml"

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: repo-audit-dead-code-readme
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Generate repository audit cleanup
        if: github.actor != 'github-actions[bot]'
        run: node scripts/repo-audit-cleanup.mjs

      - name: Test standalone Memories
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/memories-album run test 2>&1 | tee memories-test-output.txt

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memories-test-output
          path: memories-test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Build standalone Memories
        run: pnpm --filter @workspace/memories-album run build

      - name: Smoke-test production server
        run: |
          PORT=19316 pnpm --filter @workspace/memories-album run start &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19316/Memories/api/health >/tmp/memories-health.json; then
              cat /tmp/memories-health.json
              exit 0
            fi
            sleep 1
          done
          echo "Memories production server did not become healthy" >&2
          exit 1

      - name: Commit generated cleanup and lockfile
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/memories-album/src/client/AdminApp.jsx \
            artifacts/memories-album/process-content-ui-transform.mjs \
            pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Remove transformed-away admin code and refresh lockfile"
          git push origin HEAD:repo-audit-dead-code-readme
