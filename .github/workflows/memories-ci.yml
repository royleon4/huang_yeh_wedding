name: Standalone Memories CI

on:
  pull_request:
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-ci.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/memories-album/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".github/workflows/memories-ci.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test standalone Memories
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @workspace/memories-album run test 2>&1 | tee memories-test-output.txt

      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memories-test-output
          path: memories-test-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Build standalone Memories
        run: pnpm --filter @workspace/memories-album run build

      - name: Smoke-test production server
        run: |
          PORT=19316 pnpm --filter @workspace/memories-album run start &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:19316/Memories/api/health >/tmp/memories-health.json; then
              cat /tmp/memories-health.json
              exit 0
            fi
            sleep 1
          done
          echo "Memories production server did not become healthy" >&2
          exit 1

      - name: Install Playwright test runner
        run: pnpm --filter @workspace/memories-album add --save-dev @playwright/test@1.55.0 --lockfile=false

      - name: Install Chromium for Playwright
        run: pnpm --filter @workspace/memories-album exec playwright install --with-deps chromium

      - name: Run production browser gate
        run: pnpm --filter @workspace/memories-album exec playwright test --config playwright.config.mjs

      - name: Preserve Playwright failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memories-playwright-evidence
          path: |
            artifacts/memories-album/playwright-report
            artifacts/memories-album/test-results/playwright
          if-no-files-found: ignore
          retention-days: 14
