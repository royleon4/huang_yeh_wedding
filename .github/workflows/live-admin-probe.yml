name: Temporary live admin probe

on:
  pull_request:
    paths:
      - '.github/workflows/live-admin-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe production routes
        shell: bash
        run: |
          set -uo pipefail
          base='https://leon-loves-yeh.com'
          probe() {
            label="$1"
            expected="$2"
            shift 2
            status=$(curl --silent --show-error --location --max-time 20 --output "/tmp/${label}.body" --write-out '%{http_code}' "$@" || true)
            echo "${label}: HTTP ${status} (expected ${expected})"
            head -c 500 "/tmp/${label}.body" || true
            echo
            test "$status" = "$expected"
          }
          probe health 200 "$base/Memories/api/health"
          probe login_page 200 "$base/Memories/admin/login"
          probe login_api 401 \
            --request POST \
            --header 'Accept: application/json' \
            --header 'Authorization: Bearer deliberately-wrong-password' \
            --header 'X-Memories-Admin: 1' \
            "$base/Memories/admin/api/session"
