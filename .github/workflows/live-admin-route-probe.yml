name: Temporary live admin route probe

on:
  pull_request:
    paths:
      - '.github/workflows/live-admin-route-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe unauthenticated admin route
        shell: bash
        run: |
          set -euo pipefail
          base='https://leon-loves-yeh.com'
          curl --silent --show-error --max-time 20 \
            --dump-header /tmp/admin.headers \
            --output /tmp/admin.body \
            "$base/Memories/admin/"
          echo '--- headers ---'
          cat /tmp/admin.headers
          echo '--- body prefix ---'
          head -c 500 /tmp/admin.body || true
          echo
          status=$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' /tmp/admin.headers)
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {gsub(/\r/, ""); print $2}' /tmp/admin.headers | tail -1)
          echo "status=$status location=$location"
          test "$status" = "303"
          test "$location" = "/Memories/admin/login"
