name: Temporary live Memories probe

on:
  pull_request:
    paths:
      - '.github/workflows/live-admin-route-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public Memories routes
        shell: bash
        run: |
          set -uo pipefail
          base='https://leon-loves-yeh.com'
          probe() {
            label="$1"
            url="$2"
            status=$(curl --silent --show-error --max-time 30 \
              --output "/tmp/${label}.body" \
              --write-out '%{http_code}' \
              "$url" || true)
            echo "--- ${label}: HTTP ${status} ---"
            head -c 1200 "/tmp/${label}.body" || true
            echo
          }
          probe memories "$base/Memories/"
          probe health "$base/Memories/api/health"
          probe albums "$base/Memories/api/albums"
          probe processes "$base/Memories/api/processes"
          probe settings "$base/Memories/api/settings"
          probe photos "$base/Memories/api/photos?limit=1"
