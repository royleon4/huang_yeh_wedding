name: Repository audit maintenance

on:
  push:
    branches:
      - repo-audit-dead-code-readme

permissions:
  contents: write

jobs:
  cleanup-and-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: repo-audit-dead-code-readme
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Remove transformed-away administrator code
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const adminPath = 'artifacts/memories-album/src/client/AdminApp.jsx';
          let admin = fs.readFileSync(adminPath, 'utf8');

          const replaceOnce = (source, pattern, replacement, label) => {
            const next = source.replace(pattern, replacement);
            if (next === source) throw new Error(`Could not remove ${label}`);
            return next;
          };

          admin = replaceOnce(
            admin,
            /\n  const \[uploadInputKey, setUploadInputKey\] = useState\(0\);[\s\S]*?\n  const \[loading, setLoading\] = useState\(true\);/,
            '\n  const [loading, setLoading] = useState(true);',
            'legacy single-photo state',
          );

          admin = replaceOnce(
            admin,
            /  const pendingCount =\n    changeSet\.count \+ categoryVideoChanges\.length \+ \(upload\.file \? 1 : 0\);/,
            '  const pendingCount = changeSet.count + categoryVideoChanges.length;',
            'legacy upload pending count',
          );

          admin = replaceOnce(
            admin,
            /\n    setUpload\(\(current\) => \(\{[\s\S]*?\n    \}\)\);(?=\n  \};)/,
            '',
            'legacy upload normalization',
          );

          admin = replaceOnce(
            admin,
            /\n      if \(upload\.file\) \{[\s\S]*?\n      \}(?=\n\n      await loadCanonical)/,
            '',
            'legacy single-photo save branch',
          );

          admin = replaceOnce(
            admin,
            /\n  const loadMorePhotos = async \(\) => \{[\s\S]*?\n  \};(?=\n\n  const logout)/,
            '',
            'legacy photo pagination function',
          );

          admin = replaceOnce(
            admin,
            /        \{tab === "photos" && \([\s\S]*?\n        \)\}(?=\n      <\/main>)/,
            '        {tab === "photos" && (\n          <div data-admin-photo-workspace-placeholder />\n        )}',
            'legacy photo tab implementation',
          );

          admin = replaceOnce(
            admin,
            /\n              Boolean\(upload\.file && upload\.albumIds\.length === 0\)/,
            '',
            'legacy upload save guard',
          );

          fs.writeFileSync(adminPath, admin);

          const processPath = 'artifacts/memories-album/process-content-ui-transform.mjs';
          let processTransform = fs.readFileSync(processPath, 'utf8');
          processTransform = replaceOnce(
            processTransform,
            /\n  code = replaceOnce\(\n    code,\n    `                    value=\{upload\.categoryId\}[\s\S]*?"new-photo category clearing",\n  \);\n/,
            '\n',
            'dead transforms for replaced single-photo form',
          );
          fs.writeFileSync(processPath, processTransform);
          NODE

      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/memories-album/src/client/AdminApp.jsx \
            artifacts/memories-album/process-content-ui-transform.mjs \
            pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Remove transformed-away admin code and refresh lockfile"
          git push origin HEAD:repo-audit-dead-code-readme
