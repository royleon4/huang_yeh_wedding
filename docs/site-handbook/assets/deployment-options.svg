<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">部署環境選擇圖</title><desc id="desc">比較 Replit、On-premise、Google Cloud、AWS、Azure 與 Oracle Cloud 的主要元件。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdf9f5"/><stop offset="1" stop-color="#eef5f8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".11"/></filter><style>.h{font:700 32px system-ui;fill:#27373b}.sub{font:400 16px system-ui;fill:#607278}.name{font:700 19px system-ui;fill:#27373b}.t{font:400 14px system-ui;fill:#4f6268}.tag{font:700 13px system-ui;fill:#fff}</style></defs>
  <rect width="1440" height="760" fill="url(#bg)"/><text x="70" y="62" class="h">可選部署環境</text><text x="70" y="94" class="sub">目前程式最貼近 Replit；其他環境需替換 Replit Connector 或建立可攜式媒體儲存 adapter</text>
  <g filter="url(#s)">
    <g transform="translate(70 145)"><rect width="390" height="220" rx="24" fill="#fff" stroke="#d8a49d" stroke-width="2"/><rect x="24" y="24" width="86" height="28" rx="14" fill="#b66f67"/><text x="43" y="43" class="tag">最少改動</text><text x="24" y="86" class="name">Replit</text><text x="24" y="120" class="t">Autoscale / Reserved VM</text><text x="24" y="148" class="t">Published App Secrets + Replit PostgreSQL</text><text x="24" y="176" class="t">Google Drive Integration 可直接沿用</text><text x="24" y="204" class="t">適合目前正式站與快速維護</text></g>
    <g transform="translate(525 145)"><rect width="390" height="220" rx="24" fill="#fff" stroke="#c3ad7d" stroke-width="2"/><rect x="24" y="24" width="110" height="28" rx="14" fill="#987c45"/><text x="43" y="43" class="tag">完全掌控</text><text x="24" y="86" class="name">On-premise / VPS</text><text x="24" y="120" class="t">Docker Compose + Caddy/Nginx</text><text x="24" y="148" class="t">PostgreSQL + MinIO 或 Google Drive API</text><text x="24" y="176" class="t">自行負責 TLS、備份、監控與更新</text><text x="24" y="204" class="t">適合成本可控與資料自主需求</text></g>
    <g transform="translate(980 145)"><rect width="390" height="220" rx="24" fill="#fff" stroke="#82a8b0" stroke-width="2"/><rect x="24" y="24" width="120" height="28" rx="14" fill="#5e8c97"/><text x="43" y="43" class="tag">容器化推薦</text><text x="24" y="86" class="name">Google Cloud</text><text x="24" y="120" class="t">Cloud Run + Cloud SQL + Secret Manager</text><text x="24" y="148" class="t">Artifact Registry + Cloud Logging</text><text x="24" y="176" class="t">媒體可用 Drive API 或 Cloud Storage</text><text x="24" y="204" class="t">適合自動擴縮與 Google 生態</text></g>
    <g transform="translate(70 430)"><rect width="390" height="220" rx="24" fill="#fff" stroke="#84aa8b" stroke-width="2"/><rect x="24" y="24" width="120" height="28" rx="14" fill="#5f9270"/><text x="43" y="43" class="tag">企業成熟度</text><text x="24" y="86" class="name">AWS</text><text x="24" y="120" class="t">ECS Fargate + ALB + RDS PostgreSQL</text><text x="24" y="148" class="t">ECR + Secrets Manager + CloudWatch</text><text x="24" y="176" class="t">媒體建議 S3 + multipart upload</text><text x="24" y="204" class="t">適合完整 IAM、網路與監控需求</text></g>
    <g transform="translate(525 430)"><rect width="390" height="220" rx="24" fill="#fff" stroke="#b18dab" stroke-width="2"/><rect x="24" y="24" width="126" height="28" rx="14" fill="#8a6685"/><text x="43" y="43" class="tag">Microsoft 生態</text><text x="24" y="86" class="name">Microsoft Azure</text><text x="24" y="120" class="t">Container Apps + PostgreSQL Flexible Server</text><text x="24" y="148" class="t">ACR + Key Vault + Log Analytics</text><text x="24" y="176" class="t">媒體建議 Azure Blob Storage</text><text x="24" y="204" class="t">適合企業帳號、RBAC 與整合治理</text></g>
    <g transform="translate(980 430)"><rect width="390" height="220" rx="24" fill="#fff" stroke="#8b9ca9" stroke-width="2"/><rect x="24" y="24" width="104" height="28" rx="14" fill="#687989"/><text x="43" y="43" class="tag">價格彈性</text><text x="24" y="86" class="name">Oracle Cloud Infrastructure</text><text x="24" y="120" class="t">Container Instances + OCI PostgreSQL</text><text x="24" y="148" class="t">OCIR + Vault + Logging</text><text x="24" y="176" class="t">媒體建議 OCI Object Storage</text><text x="24" y="204" class="t">適合 OCI 配額、VCN 與成本策略</text></g>
  </g>
</svg>