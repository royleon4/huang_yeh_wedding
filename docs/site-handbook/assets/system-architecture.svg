<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">詠葉婚禮網站系統架構</title>
  <desc id="desc">顯示瀏覽器、反向代理、婚禮邀請、Memories、PostgreSQL、媒體儲存與 CI 的關係。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf7"/><stop offset="1" stop-color="#f2f7f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#51646b"/></marker>
    <style>
      .title{font:700 34px system-ui,sans-serif;fill:#28363b}.subtitle{font:400 17px system-ui,sans-serif;fill:#62747a}
      .box{rx:22;stroke-width:2;filter:url(#shadow)}.h{font:700 20px system-ui,sans-serif;fill:#26363a}.t{font:400 15px system-ui,sans-serif;fill:#4a5f66}
      .line{stroke:#51646b;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:9 8}
    </style>
  </defs>
  <rect width="1440" height="820" fill="url(#bg)"/>
  <text x="72" y="64" class="title">詠葉婚禮網站｜目前系統架構</text>
  <text x="72" y="96" class="subtitle">同一個 pnpm monorepo，分隔公開邀請網站、Standalone Memories 與 Legacy API</text>

  <rect x="70" y="145" width="260" height="145" class="box" fill="#ffffff" stroke="#d6a8a0"/>
  <text x="98" y="188" class="h">訪客與管理員</text><text x="98" y="222" class="t">Chrome／Safari／Firefox</text><text x="98" y="248" class="t">LINE／WeChat／FB／IG</text><text x="98" y="274" class="t">中文與 English routes</text>

  <rect x="470" y="135" width="500" height="165" class="box" fill="#fff" stroke="#99aeb5"/>
  <text x="505" y="180" class="h">入口與路由層</text><text x="505" y="214" class="t">Replit application router 或雲端 Load Balancer / Reverse Proxy</text><text x="505" y="242" class="t">TLS、custom domain、/Memories/*、/api/* 與 legacy 邊界</text><text x="505" y="270" class="t">Health: /Memories/api/health</text>

  <rect x="1090" y="145" width="280" height="145" class="box" fill="#ffffff" stroke="#9fba9b"/>
  <text x="1120" y="188" class="h">GitHub Actions</text><text x="1120" y="222" class="t">Node tests／typecheck</text><text x="1120" y="248" class="t">Production build／smoke</text><text x="1120" y="274" class="t">Playwright cross-browser gate</text>

  <path d="M330 218 H470" class="line"/><path d="M1090 218 H970" class="line dash"/>

  <rect x="70" y="385" width="350" height="185" class="box" fill="#fff" stroke="#d6a8a0"/>
  <text x="102" y="430" class="h">Wedding Invitation</text><text x="102" y="464" class="t">React 19 + Vite 7</text><text x="102" y="492" class="t">Route: /</text><text x="102" y="520" class="t">Port: 19315</text><text x="102" y="548" class="t">Legacy UI；受 boundary workflow 保護</text>

  <rect x="545" y="355" width="350" height="245" class="box" fill="#fff" stroke="#87a9af"/>
  <text x="577" y="400" class="h">Standalone Memories</text><text x="577" y="434" class="t">React + Vite + Node HTTP server</text><text x="577" y="462" class="t">Route: /Memories/* · Port: 19316</text><text x="577" y="490" class="t">Albums · Labels · Guestbook · Upload</text><text x="577" y="518" class="t">Admin · Word import · Image processing</text><text x="577" y="546" class="t">Stable routes · Bilingual UI · PWA-ready path</text><text x="577" y="574" class="t">Current primary product surface</text>

  <rect x="1020" y="385" width="350" height="185" class="box" fill="#fff" stroke="#c4ad84"/>
  <text x="1052" y="430" class="h">Legacy API</text><text x="1052" y="464" class="t">Express / generated server stack</text><text x="1052" y="492" class="t">Route: /api/* · Port: 8080</text><text x="1052" y="520" class="t">Old photo-wall Object Storage boundary</text><text x="1052" y="548" class="t">Do not couple ordinary Memories work</text>

  <path d="M620 300 L245 385" class="line"/><path d="M720 300 V355" class="line"/><path d="M820 300 L1195 385" class="line"/>

  <rect x="150" y="675" width="310" height="105" class="box" fill="#fff" stroke="#7799aa"/>
  <text x="180" y="718" class="h">PostgreSQL</text><text x="180" y="748" class="t">Metadata · settings · messages · migrations</text>

  <rect x="565" y="675" width="310" height="105" class="box" fill="#fff" stroke="#7eaa8b"/>
  <text x="595" y="718" class="h">Media storage adapter</text><text x="595" y="748" class="t">Current: Google Drive · Portable: object store</text>

  <rect x="980" y="675" width="310" height="105" class="box" fill="#fff" stroke="#b292af"/>
  <text x="1010" y="718" class="h">Secrets &amp; observability</text><text x="1010" y="748" class="t">Secret manager · logs · metrics · alerts</text>

  <path d="M650 600 L380 675" class="line"/><path d="M720 600 V675" class="line"/><path d="M790 600 L1050 675" class="line"/>
</svg>