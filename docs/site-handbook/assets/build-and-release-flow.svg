<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">從零架站到發佈的流程</title><desc id="desc">從需求、環境、資料庫、媒體儲存、開發、測試到部署與監控。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf6"/><stop offset="1" stop-color="#f1f7fa"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".12"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#65757b"/></marker><style>.h{font:700 31px system-ui;fill:#28363b}.n{font:700 18px system-ui;fill:#fff}.t{font:600 17px system-ui;fill:#27383d}.s{font:400 14px system-ui;fill:#52676e}.line{stroke:#65757b;stroke-width:3;marker-end:url(#a)}</style></defs>
  <rect width="1440" height="560" fill="url(#bg)"/><text x="70" y="62" class="h">從零架站到正式發佈</text>
  <g filter="url(#s)">
    <g transform="translate(70 135)"><rect width="170" height="250" rx="24" fill="#fff" stroke="#d7aaa1" stroke-width="2"/><circle cx="85" cy="50" r="28" fill="#b96f68"/><text x="79" y="57" class="n">1</text><text x="26" y="104" class="t">需求與範圍</text><text x="22" y="142" class="s">路由與角色</text><text x="22" y="168" class="s">資料責任</text><text x="22" y="194" class="s">隱私與保留</text><text x="22" y="220" class="s">雲端或自架</text></g>
    <g transform="translate(295 135)"><rect width="170" height="250" rx="24" fill="#fff" stroke="#c2ad83" stroke-width="2"/><circle cx="85" cy="50" r="28" fill="#9e7e46"/><text x="79" y="57" class="n">2</text><text x="31" y="104" class="t">開發環境</text><text x="22" y="142" class="s">Node.js 24</text><text x="22" y="168" class="s">pnpm 10</text><text x="22" y="194" class="s">Git／GitHub</text><text x="22" y="220" class="s">Secrets template</text></g>
    <g transform="translate(520 135)"><rect width="170" height="250" rx="24" fill="#fff" stroke="#86a9af" stroke-width="2"/><circle cx="85" cy="50" r="28" fill="#5f8e98"/><text x="79" y="57" class="n">3</text><text x="31" y="104" class="t">資料與媒體</text><text x="22" y="142" class="s">PostgreSQL</text><text x="22" y="168" class="s">Migration</text><text x="22" y="194" class="s">Drive / Object store</text><text x="22" y="220" class="s">Backup plan</text></g>
    <g transform="translate(745 135)"><rect width="170" height="250" rx="24" fill="#fff" stroke="#7faa8b" stroke-width="2"/><circle cx="85" cy="50" r="28" fill="#5e9270"/><text x="79" y="57" class="n">4</text><text x="40" y="104" class="t">實作功能</text><text x="22" y="142" class="s">React + Vite</text><text x="22" y="168" class="s">Node API</text><text x="22" y="194" class="s">Admin / Upload</text><text x="22" y="220" class="s">Bilingual routes</text></g>
    <g transform="translate(970 135)"><rect width="170" height="250" rx="24" fill="#fff" stroke="#b391ad" stroke-width="2"/><circle cx="85" cy="50" r="28" fill="#8b6686"/><text x="79" y="57" class="n">5</text><text x="31" y="104" class="t">測試與安全</text><text x="22" y="142" class="s">Node tests</text><text x="22" y="168" class="s">Playwright</text><text x="22" y="194" class="s">SCA / SBOM</text><text x="22" y="220" class="s">Review gate</text></g>
    <g transform="translate(1195 135)"><rect width="170" height="250" rx="24" fill="#fff" stroke="#8999a8" stroke-width="2"/><circle cx="85" cy="50" r="28" fill="#65788a"/><text x="79" y="57" class="n">6</text><text x="40" y="104" class="t">部署維運</text><text x="22" y="142" class="s">TLS / Domain</text><text x="22" y="168" class="s">Health / Logs</text><text x="22" y="194" class="s">Rollback</text><text x="22" y="220" class="s">Restore drill</text></g>
  </g>
  <line x1="240" y1="260" x2="295" y2="260" class="line"/><line x1="465" y1="260" x2="520" y2="260" class="line"/><line x1="690" y1="260" x2="745" y2="260" class="line"/><line x1="915" y1="260" x2="970" y2="260" class="line"/><line x1="1140" y1="260" x2="1195" y2="260" class="line"/>
  <rect x="70" y="440" width="1295" height="64" rx="18" fill="#fff" stroke="#c8d2d5"/><text x="95" y="480" class="t">每一步都要有：可重現指令、驗證證據、回滾方法、文件更新與資料保護界線。</text>
</svg>