openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: photos
    description: Public wedding album operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /photos:
    get:
      operationId: listPublicPhotos
      tags: [photos]
      summary: List public wedding photos
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor returned by the previous page
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: A newest-first page of public photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPhotoPage"
        "400":
          description: Invalid cursor or page size
  /photos/{photoId}/media:
    get:
      operationId: getPublicPhotoMedia
      tags: [photos]
      summary: Stream a public photo through its opaque website ID
      parameters:
        - name: photoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Photo bytes proxied from private Drive storage
          headers:
            X-Content-Type-Options:
              schema:
                type: string
                const: nosniff
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: Photo is missing or not public
        "502":
          description: Private storage is temporarily unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PublicPhoto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mediaUrl:
          type: string
          description: Controlled website endpoint; never a Google Drive URL
        contentType:
          type: string
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, mediaUrl, contentType, width, height, createdAt]
    PublicPhotoPage:
      type: object
      properties:
        photos:
          type: array
          items:
            $ref: "#/components/schemas/PublicPhoto"
        nextCursor:
          type: [string, "null"]
      required: [photos, nextCursor]
