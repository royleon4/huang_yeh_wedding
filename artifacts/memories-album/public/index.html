<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef6e2" />
    <title>婚禮相簿 Memories</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, #f0f7e6, #faf6d8 45%, #eef6e2); color: #24543a; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
      section { width: min(100%, 560px); padding: 32px 24px; border: 1px solid rgba(255,255,255,.8); border-radius: 28px; background: rgba(255,255,255,.72); box-shadow: 0 20px 60px rgba(36,84,58,.12); backdrop-filter: blur(12px); }
      h1 { margin: 8px 0 12px; font-family: Georgia, serif; font-size: clamp(2.4rem, 12vw, 4.5rem); font-style: italic; }
      p { margin: 8px auto; max-width: 38ch; line-height: 1.7; }
      small { display: block; margin-top: 20px; color: #557a63; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <div aria-hidden="true">🥝 📷</div>
        <h1>Memories</h1>
        <p>新的婚禮瀑布相簿正在獨立建置中。</p>
        <p>This standalone wedding gallery is being built independently.</p>
        <small>Legacy invitation and photo wall remain unchanged.</small>
      </section>
    </main>
  </body>
</html>
